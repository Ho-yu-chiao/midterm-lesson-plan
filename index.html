<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>期中教學教案與資源庫 | 開放教案中心</title>
  <!-- SEO & Meta -->
  <meta name="description" content="期中教學教案與教材資源庫，收錄 108 課綱投石戰車 STEAM 跨域教案、運算思維、科普閱讀等公開教學設計。">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Marked.js for markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Mermaid.js for diagrams -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <!-- KaTeX for math formulas -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --sidebar-width: 330px;
      --header-height: 64px;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #334155;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      height: var(--header-height);
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(8px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--primary);
      text-decoration: none;
    }

    .brand-badge {
      background: #dbeafe;
      color: #1e40af;
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 9999px;
      font-weight: 600;
    }

    [data-theme="dark"] .brand-badge {
      background: #1e3a8a;
      color: #bfdbfe;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.85rem;
      font-size: 0.875rem;
      font-weight: 500;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: var(--border);
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    /* Main Container */
    .layout {
      display: flex;
      flex: 1;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
    }

    /* Sidebar */
    aside {
      width: var(--sidebar-width);
      border-right: 1px solid var(--border);
      background: var(--card-bg);
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      height: calc(100vh - var(--header-height));
      position: sticky;
      top: var(--header-height);
      overflow-y: auto;
    }

    .search-input {
      width: 100%;
      padding: 0.6rem 0.85rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .plan-list-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .plan-nav-item {
      display: block;
      padding: 0.75rem 0.85rem;
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 0.35rem;
      transition: all 0.15s ease;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .plan-nav-item:hover {
      background: var(--bg);
    }

    .plan-nav-item.active {
      background: #eff6ff;
      color: var(--primary);
      font-weight: 600;
      border-color: #bfdbfe;
    }

    [data-theme="dark"] .plan-nav-item.active {
      background: #1e293b;
      color: #60a5fa;
      border-color: #3b82f6;
    }

    .plan-nav-tag {
      font-size: 0.7rem;
      display: block;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    /* Content Area */
    main {
      flex: 1;
      padding: 2.5rem 3.5rem;
      overflow-y: auto;
      max-width: 980px;
    }

    .article-header {
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
    }

    .article-title {
      font-size: 2.1rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 0.5rem;
    }

    .article-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    /* Markdown Body Styling */
    .markdown-body {
      font-size: 1.05rem;
      line-height: 1.85;
      color: var(--text);
    }

    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
      margin-top: 2rem;
      margin-bottom: 0.85rem;
      font-weight: 700;
      color: var(--text);
    }

    .markdown-body h1 { font-size: 1.85rem; border-bottom: 2px solid var(--border); padding-bottom: 0.4rem; }
    .markdown-body h2 { font-size: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.35rem; }
    .markdown-body h3 { font-size: 1.25rem; }

    .markdown-body p {
      margin-bottom: 1.25rem;
    }

    .markdown-body ul, .markdown-body ol {
      padding-left: 1.6rem;
      margin-bottom: 1.25rem;
    }

    .markdown-body li {
      margin-bottom: 0.4rem;
    }

    .markdown-body blockquote {
      border-left: 4px solid var(--primary);
      padding: 0.75rem 1.2rem;
      margin: 1.5rem 0;
      background: var(--bg);
      border-radius: 0 8px 8px 0;
      color: var(--text);
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.75rem 0;
      font-size: 0.95rem;
      display: block;
      overflow-x: auto;
    }

    .markdown-body th, .markdown-body td {
      border: 1px solid var(--border);
      padding: 0.8rem 1rem;
      text-align: left;
    }

    .markdown-body th {
      background: var(--bg);
      font-weight: 600;
    }

    .markdown-body code {
      background: var(--bg);
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.9em;
      border: 1px solid var(--border);
    }

    .markdown-body pre {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin: 1.5rem 0;
      padding: 1.2rem;
      overflow-x: auto;
    }

    .markdown-body pre code {
      border: none;
      padding: 0;
      font-size: 0.88rem;
      line-height: 1.6;
    }

    .mermaid {
      display: flex;
      justify-content: center;
      margin: 2rem 0;
      background: var(--card-bg);
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    /* Print styling */
    @media print {
      header, aside, .btn, .nav-actions {
        display: none !important;
      }
      body {
        background: #fff;
        color: #000;
      }
      main {
        padding: 0;
        max-width: 100%;
      }
    }

    /* Responsive */
    @media (max-width: 860px) {
      .layout {
        flex-direction: column;
      }
      aside {
        width: 100%;
        height: auto;
        position: relative;
        top: 0;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      main {
        padding: 1.5rem 1rem;
      }
      .article-header {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="#" class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
        <path d="M6 6h10"></path>
        <path d="M6 10h10"></path>
      </svg>
      <span>期中教學教案與資源庫</span>
      <span class="brand-badge">公開教材</span>
    </a>
    <div class="nav-actions">
      <button class="btn" id="themeBtn" title="切換深色/淺色主題">
        🌓 主題
      </button>
      <button class="btn" onclick="window.print()" title="列印或匯出 PDF">
        🖨️ 列印 / PDF
      </button>
      <a href="https://github.com/Ho-yu-chiao/midterm-lesson-plan" target="_blank" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        GitHub 原始庫
      </a>
    </div>
  </header>

  <div class="layout">
    <!-- Sidebar -->
    <aside>
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜尋教案關鍵字...">
      <div>
        <div class="plan-list-title">教案清單</div>
        <nav id="planListNav">
          <!-- Populated by JavaScript -->
        </nav>
      </div>
      <div style="margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.8rem; color: var(--text-muted);">
        授權：<a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh-tw" target="_blank" style="color: inherit;">CC BY-NC-SA 4.0</a><br>
        維護：周昱芊、陳新宜、何羽喬、許睿芯
      </div>
    </aside>

    <!-- Main Content -->
    <main>
      <div class="article-header">
        <div>
          <h1 class="article-title" id="articleTitle">載入中...</h1>
          <div class="article-meta">
            <span id="articleAuthor">教學設計：周昱芊、陳新宜、何羽喬、許睿芯</span>
            <span>•</span>
            <span id="articleSubject">領域分類</span>
          </div>
        </div>
      </div>
      <article class="markdown-body" id="articleContent">
        <!-- Rendered Markdown goes here -->
      </article>
    </main>
  </div>

  <script>
    // Initialize Mermaid
    mermaid.initialize({ startOnLoad: false, theme: 'default' });

    // Embedded Lesson Plan Data
    const plans = [
      {
        id: "01-catapult",
        title: "投石戰車（國小科技資訊教案）",
        subject: "自然科學（1節）+ 資訊科技（4節）跨域 STEAM",
        author: "周昱芊、陳新宜、何羽喬、許睿芯",
        path: "plans/01-投石戰車-國小科技資訊教育教案.md",
        rawUrl: "./plans/01-投石戰車-國小科技資訊教育教案.md"
      },
      {
        id: "02-algo",
        title: "運算思維與演算法基礎探究",
        subject: "科技領域 / 資訊科技",
        author: "Ho-yu-chiao",
        path: "plans/02-運算思維與演算法期中教學設計.md",
        rawUrl: "./plans/02-運算思維與演算法期中教學設計.md"
      },
      {
        id: "03-reading",
        title: "科普文本閱讀理解與資訊素養",
        subject: "語文與資訊領域跨域",
        author: "Ho-yu-chiao",
        path: "plans/03-科普閱讀與資訊素養期中教案.md",
        rawUrl: "./plans/03-科普閱讀與資訊素養期中教案.md"
      }
    ];

    let currentPlanId = plans[0].id;

    function renderNav(filter = "") {
      const nav = document.getElementById("planListNav");
      nav.innerHTML = "";
      const filtered = plans.filter(p => p.title.toLowerCase().includes(filter.toLowerCase()) || p.subject.toLowerCase().includes(filter.toLowerCase()));
      
      filtered.forEach(p => {
        const a = document.createElement("a");
        a.className = `plan-nav-item ${p.id === currentPlanId ? 'active' : ''}`;
        a.innerHTML = `
          <strong>${p.title}</strong>
          <span class="plan-nav-tag">${p.subject}</span>
        `;
        a.onclick = () => loadPlan(p.id);
        nav.appendChild(a);
      });
    }

    async function loadPlan(id) {
      currentPlanId = id;
      renderNav(document.getElementById("searchInput").value);

      const plan = plans.find(p => p.id === id);
      if (!plan) return;

      document.getElementById("articleTitle").textContent = plan.title;
      document.getElementById("articleAuthor").textContent = `設計者：${plan.author}`;
      document.getElementById("articleSubject").textContent = plan.subject;
      document.getElementById("articleContent").innerHTML = "<p>正在載入教案內容...</p>";

      try {
        const response = await fetch(plan.rawUrl);
        if (!response.ok) throw new Error("讀取失敗");
        const mdText = await response.text();
        
        // Custom renderer for marked to support mermaid code blocks
        const renderer = new marked.Renderer();
        const originalCodeRenderer = renderer.code.bind(renderer);
        renderer.code = function(code, language) {
          if (language === 'mermaid') {
            return `<div class="mermaid">${code}</div>`;
          }
          return originalCodeRenderer(code, language);
        };

        document.getElementById("articleContent").innerHTML = marked.parse(mdText, { renderer });
        
        // Render mermaid if present
        try {
          await mermaid.run({
            nodes: document.querySelectorAll('.mermaid')
          });
        } catch (mErr) {
          console.warn("Mermaid render error:", mErr);
        }
      } catch (err) {
        document.getElementById("articleContent").innerHTML = `
          <div style="background: #fee2e2; color: #b91c1c; padding: 1.25rem; border-radius: 8px;">
            ⚠️ 無法透過網路動態讀取 <code>${plan.path}</code>（若為本機以 file:// 協定直接開啟，受到瀏覽器跨域存取保護）。<br>
            發布至 GitHub Pages 或以本機伺服器開啟時將完全正常運作。
          </div>
        `;
      }
    }

    // Theme toggle
    const themeBtn = document.getElementById("themeBtn");
    themeBtn.onclick = () => {
      const current = document.body.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      document.body.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
    };

    if (localStorage.getItem("theme") === "dark") {
      document.body.setAttribute("data-theme", "dark");
    }

    // Search filter
    document.getElementById("searchInput").addEventListener("input", (e) => {
      renderNav(e.target.value);
    });

    // Initial load
    renderNav();
    loadPlan(currentPlanId);
  </script>
</body>
</html>
